name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore StageKit.slnx -p:NuGetAudit=false

      - name: Build
        run: dotnet build StageKit.slnx --configuration Release --no-restore

      - name: Test net8.0
        run: >-
          dotnet run --project StageKit.Tests/StageKit.Tests.csproj
          --framework net8.0 --configuration Release --no-build --
          -noLogo -noColor -parallel none -automated sync

      - name: Test net10.0
        run: >-
          dotnet run --project StageKit.Tests/StageKit.Tests.csproj
          --framework net10.0 --configuration Release --no-build --
          -noLogo -noColor -parallel none -automated sync
