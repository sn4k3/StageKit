name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore StageKit.slnx -p:NuGetAudit=false

      - name: Build
        run: dotnet build StageKit.slnx --configuration Release --no-restore

      - name: Test StageKit
        run: >-
          dotnet run --project tests/StageKit.Tests/StageKit.Tests.csproj
          --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallelMode none -automated sync

      - name: Test StageKit.Updatum
        run: >-
          dotnet run --project tests/StageKit.Updatum.Tests/StageKit.Updatum.Tests.csproj
          --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallelMode none -automated sync

      - name: Test StageKit.Fallout
        run: >-
          dotnet run --project tests/StageKit.Fallout.Tests/StageKit.Fallout.Tests.csproj
          --framework net10.0 --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallelMode none -automated sync
