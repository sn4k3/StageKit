name: 📦 NuGet package publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Perform a dry run (pack only, no push or release)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore StageKit.slnx -p:NuGetAudit=false

      - name: Build
        run: dotnet build StageKit.slnx --configuration Release --no-restore

      - name: Test net8.0
        run: >-
          dotnet run --project StageKit.Tests/StageKit.Tests.csproj
          --framework net8.0 --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallel none -automated sync

      - name: Test net10.0
        run: >-
          dotnet run --project StageKit.Tests/StageKit.Tests.csproj
          --framework net10.0 --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallel none -automated sync

      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          version="$(dotnet msbuild StageKit/StageKit.csproj -getProperty:Version | tail -n 1)"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Unable to determine package version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          awk 'NR == 1 { next } /^# / { exit } { print }' CHANGELOG.md > release-notes.md

      - name: Pack StageKit.Primitives
        run: >-
          dotnet pack StageKit.Primitives/StageKit.Primitives.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/packages

      - name: Pack StageKit.Runtime
        run: >-
          dotnet pack StageKit.Runtime/StageKit.Runtime.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/packages

      - name: Pack StageKit
        run: >-
          dotnet pack StageKit/StageKit.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Create release tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"

      - name: Publish to NuGet.org
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_TOKEN" --skip-duplicate

      - name: Publish to GitHub Packages
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key "$GITHUB_TOKEN" --skip-duplicate

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.tag }}
          body_path: release-notes.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report dry run
        if: ${{ inputs.dry_run }}
        run: echo "Dry run complete; packages were created and uploaded as an artifact."
