name: 🚀 Publish release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without publishing packages or creating a release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish_packages:
    name: Publish packages
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore StageKit.slnx -p:NuGetAudit=false

      - name: Build
        run: dotnet build StageKit.slnx --configuration Release --no-restore

      - name: Test StageKit
        run: >-
          dotnet run --project tests/StageKit.Tests/StageKit.Tests.csproj
          --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallelMode none -automated sync

      - name: Test StageKit.Demo
        run: >-
          dotnet run --project tests/StageKit.Demo.Tests/StageKit.Demo.Tests.csproj
          --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallelMode none -automated sync

      - name: Test StageKit.Updatum
        run: >-
          dotnet run --project tests/StageKit.Updatum.Tests/StageKit.Updatum.Tests.csproj
          --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallelMode none -automated sync

      - name: Test StageKit.Fallout
        run: >-
          dotnet run --project tests/StageKit.Fallout.Tests/StageKit.Fallout.Tests.csproj
          --framework net10.0 --configuration Release --no-build --no-restore --
          -noLogo -noColor -parallelMode none -automated sync

      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          version="$(dotnet msbuild src/StageKit/StageKit.csproj -getProperty:Version | tail -n 1)"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Unable to determine package version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          awk 'NR == 1 { next } /^# / { exit } { print }' CHANGELOG.md > release-notes.md

      - name: Pack StageKit.Primitives
        run: >-
          dotnet pack src/StageKit.Primitives/StageKit.Primitives.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/packages

      - name: Pack StageKit.Runtime
        run: >-
          dotnet pack src/StageKit.Runtime/StageKit.Runtime.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/packages

      - name: Pack StageKit.Updatum
        run: >-
          dotnet pack src/StageKit.Updatum/StageKit.Updatum.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/packages

      - name: Pack StageKit
        run: >-
          dotnet pack src/StageKit/StageKit.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Report dry run
        if: ${{ inputs.dry_run }}
        run: echo "Dry run package preparation complete; packages were uploaded as an artifact."

  publish_assets:
    name: Publish asset (${{ matrix.rid }})
    needs: publish_packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
            flatpak_arch: x86_64
          - rid: linux-arm64
            os: ubuntu-latest
            flatpak_arch: aarch64
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Linux packaging tools
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder dpkg-dev makepkg fakeroot zstd snapd
          sudo snap install snapcraft --classic
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --arch=${{ matrix.flatpak_arch }} flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          command -v flatpak-builder
          command -v dpkg-deb
          command -v makepkg
          command -v snapcraft

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore StageKit.slnx -p:NuGetAudit=false

      - name: Restore Fallout tool
        run: dotnet tool restore

      - name: Publish runtime asset
        run: dotnet fallout Publish --rids ${{ matrix.rid }} --delete-publish-directories

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.rid }}
          path: artifacts/publish/*
          if-no-files-found: error

  publish_registries:
    name: Publish package registries
    needs: [publish_packages, publish_assets]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key "$GITHUB_TOKEN" --skip-duplicate

      - name: Publish to NuGet.org
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_TOKEN" --skip-duplicate

  create_tag:
    name: Create release tag
    needs: [publish_packages, publish_assets, publish_registries]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Create and push tag
        env:
          TAG: ${{ needs.publish_packages.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"

  create_release:
    name: Create GitHub release
    needs: [publish_packages, publish_assets, create_tag]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Prepare release notes
        shell: bash
        run: awk 'NR == 1 { next } /^# / { exit } { print }' CHANGELOG.md > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish_packages.outputs.tag }}
          name: ${{ needs.publish_packages.outputs.tag }}
          body_path: release-notes.md
          draft: false
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
